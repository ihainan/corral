name: Idea or feature request
description: Something Corral could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation and what gets in the way, rather than the solution alone.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would help
